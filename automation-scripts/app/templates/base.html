<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>{% block title %}Automation Scripts{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('index') }}" class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>Automation<span class="brand-light"> Scripts</span></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Scripts</a>
      <a href="{{ url_for('runs') }}" {% if request.endpoint in ('runs', 'run_detail') %}aria-current="page"{% endif %}>History</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
